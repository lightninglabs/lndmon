name: Docker image build

on:
  push:
    tags:
      - 'v*'


defaults:
  run:
    shell: bash

env:
  DOCKER_REPO: lightninglabs
  DOCKER_IMAGE: lndmon

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: lightninglabs/gh-actions/setup-qemu-action@2dc80276a67ed623f48270cfa858ee7f1025fe61 # 2026.11.09.00

      - name: Set up Docker Buildx
        uses: lightninglabs/gh-actions/setup-buildx-action@2dc80276a67ed623f48270cfa858ee7f1025fe61 # 2026.11.09.00

      - name: Login to DockerHub
        uses: lightninglabs/gh-actions/login-action@2dc80276a67ed623f48270cfa858ee7f1025fe61 # 2026.11.09.00
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Build and push
        id: docker_build
        uses: lightninglabs/gh-actions/build-push-action@2dc80276a67ed623f48270cfa858ee7f1025fe61 # 2026.11.09.00
        env:
          # Don't upload a build record artifact for each build.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          push: true
          # Publish the image without a provenance attestation, as before.
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: "${{ env.DOCKER_REPO }}/${{ env.DOCKER_IMAGE }}:${{ env.RELEASE_VERSION }}"
          build-args: checkout=${{ env.RELEASE_VERSION }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
